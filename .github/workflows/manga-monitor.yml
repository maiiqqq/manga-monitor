name: Go-Manga Monitor
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.chained == 'yes' && inputs.chain_request_id != '' && format('Go-Manga Monitor (chain {0})', inputs.chain_request_id) || 'Go-Manga Monitor' }}

on:
  schedule:
    # Run every 5 minutes (GitHub Actions minimum interval)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      backfill_today:
        description: "Check chapters on backfill_date; accepted delivery events are not resent"
        type: boolean
        default: false
      backfill_date:
        description: "Date to resend as YYYY-MM-DD (blank = today, site tz UTC+7)"
        type: string
        default: ""
      backfill_dryrun:
        description: "Preview any mode: scrape only; no Telegram, state writes or self-chain"
        type: boolean
        default: false
      check_urls:
        description: "Recheck specific manga URLs directly (comma-separated)"
        type: string
        default: ""
      chained:
        description: "internal marker set by the self-chain step (leave blank)"
        type: string
        default: ""
      chain_request_id:
        description: "internal parent run/attempt correlation (leave blank)"
        type: string
        default: ""

# Scheduled runs and self-chain runs share one serialized group so they never
# race on the state push. Manual dispatches (diagnostics: check_urls / backfill)
# get their own per-run group so the continuous chain can't cancel them.
concurrency:
  group: manga-monitor-${{ (github.event_name == 'workflow_dispatch' && inputs.chained != 'yes') && github.run_id || 'state' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # Allow pushing commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history needed for push

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Manga Bot (looped, near real-time)
        id: run_bot
        # Hard cap the step so a stuck Telegram long-poll can never hold the
        # runner for the full job timeout. Slightly above MAX_RUNTIME_SECONDS.
        timeout-minutes: 5
        continue-on-error: true  # A throttled/killed loop must still commit state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Persist delivery intent before sending; use the existing contents:write.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Loop long-polling for ~4 min each run, then hand off to the next
          # scheduled run. Ending well inside the 5-min cron slot leaves margin
          # so a delayed next run overlaps (and is queued) far less often, which
          # avoids the concurrency-cancel churn when GitHub bursts backlogged
          # schedule events. Commands/buttons are answered within seconds live.
          MAX_RUNTIME_SECONDS: '240'
          # Empty on schedule/self-chain (normal loop); "true" only when a
          # manual dispatch requests a one-off resend of today's updates.
          BACKFILL_TODAY: ${{ inputs.backfill_today }}
          BACKFILL_DATE: ${{ inputs.backfill_date }}
          BACKFILL_DRYRUN: ${{ inputs.backfill_dryrun }}
          CHECK_URLS: ${{ inputs.check_urls }}
        run: |
          python bot_realtime.py

      - name: Snapshot state for recovery
        id: snapshot_state
        if: always() && inputs.backfill_dryrun != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          python3 .github/scripts/snapshot_state.py --source . \
            --destination "$RUNNER_TEMP/state-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Commit state changes (if any)
        id: persist_state
        if: always() && inputs.backfill_dryrun != true && steps.snapshot_state.outcome == 'success'
        # The state files are JSON dicts, so a rejected push is resolved by
        # merging them per key on top of the current remote tip (merge_state.py)
        # instead of rebasing. A rebase hits a text conflict as soon as two runs
        # touch the same file — a manual check_urls/backfill dispatch runs in its
        # own concurrency group alongside the chain — and `rebase --abort` then
        # leaves the branch behind the remote, so every retry was rejected again
        # and the step always ended in "failed to push after 5 attempts".
        run: |
          set -euo pipefail
          # Include setup in the deadline: TERM at 175s, then KILL after 5s.
          timeout --signal=TERM --kill-after=5s 175s bash -euo pipefail -c '
            umask 077
            # Keep the running helper outside the checkout before any reset.
            script="$RUNNER_TEMP/persist-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
            cp .github/scripts/persist_state.sh "$script"
            exec bash "$script"
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload state recovery snapshot
        id: upload_state_recovery
        if: always() && inputs.backfill_dryrun != true && (steps.snapshot_state.outcome == 'failure' || steps.persist_state.outcome == 'failure' || steps.run_bot.outcome == 'failure')
        continue-on-error: true  # Preserve the original failure if upload also fails
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manga-state-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-recovery-${{ github.run_id }}-${{ github.run_attempt }}/artifact/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          archive: true

      - name: Keep the loop alive (self-chain next run)
        id: self_chain
        if: always()
        continue-on-error: true  # Cron is fallback; preserve persistence's outcome
        timeout-minutes: 1
        # One dispatch POST only; ambiguous responses use correlated GET checks.
        # Keep the existing PAT policy and best-effort */5 cron fallback.
        env:
          CHAIN_PAT: ${{ secrets.WORKFLOW_PAT }}
          BACKFILL_DRYRUN: ${{ inputs.backfill_dryrun }}
          PERSISTENCE_OUTCOME: ${{ steps.persist_state.outcome }}
        run: |
          set -euo pipefail
          umask 077
          helper="$RUNNER_TEMP/self-chain-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          # Persistence may reset the checkout. Read the helper from the initial
          # workflow revision instead of whichever files are now on master.
          if ! git show "$GITHUB_SHA:.github/scripts/dispatch_next_run.py" > "$helper" 2>/dev/null; then
            echo "::warning::Self-chain helper unavailable; cron remains fallback."
            printf '### Go-Manga handoff\n\n| Component | Outcome |\n|---|---|\n| Persistence | %s |\n| Self-chain | failed |\n\nReason: helper_unavailable. Cron remains fallback.\n' \
              "${PERSISTENCE_OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 "$helper"
